<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kite Lite</title><style>body{font:17px system-ui;background:linear-gradient(130deg,#10182d,#233b73);color:white;margin:0;min-height:100vh}main{max-width:850px;margin:auto;padding:35px}h1{font-size:42px}p{color:#c9d6ee}input,button{font:inherit;border-radius:12px;padding:14px;border:1px solid #5973a5}input{background:#182541;color:white;width:95%}button{cursor:pointer;background:#243e6a;color:white}.grid{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}.grid button{flex:1;min-width:180px;text-align:left;padding:25px}.game{display:none;margin-top:25px;background:#182a4c;padding:22px;border-radius:18px}#board{display:grid;grid-template-columns:repeat(3,75px);gap:7px}#board button{height:75px;font-size:32px}#memoryGrid{display:grid;grid-template-columns:repeat(4,70px);gap:7px}#memoryGrid button{height:70px;font-size:28px}#colorButtons{display:flex;gap:10px;flex-wrap:wrap}#colorButtons button{width:75px;height:75px}</style><main><header>🪁 <b>Kite Lite</b></header><h1>Take a quick game break.</h1><p>Three original mini games that run right in your browser.</p><input id="search" placeholder="Search games..."><div class="grid"><button data-game="tic">❌<h3>Tic Tac Toe</h3>Play with a friend</button><button data-game="color">🎨<h3>Color Match</h3>Choose the right color</button><button data-game="memory">🧠<h3>Memory Flip</h3>Find matching pairs</button></div><section class="game" id="tic"><h2>Tic Tac Toe</h2><p id="ticStatus"></p><div id="board"></div><p><button onclick="resetTic()">Restart</button></p></section><section class="game" id="color"><h2>Color Match</h2><p>Pick the named color: <strong id="target"></strong></p><div id="colorButtons"></div><p id="colorStatus"></p><button onclick="nextColor()">Next color</button></section><section class="game" id="memory"><h2>Memory Flip</h2><p id="memoryStatus"></p><div id="memoryGrid"></div><button onclick="resetMemory()">Restart</button></section></main><script>const $=id=>document.getElementById(id);document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.game').forEach(g=>g.style.display='none');$(b.dataset.game).style.display='block'});$('search').oninput=e=>document.querySelectorAll('[data-game]').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'':'none');let board,turn,over;function resetTic(){board=Array(9).fill('');turn='X';over=false;$('ticStatus').textContent="X's turn";drawTic()}function drawTic(){$('board').innerHTML='';board.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(over||board[i])return;board[i]=turn;let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];if(wins.some(w=>w.every(j=>board[j]===turn))){$('ticStatus').textContent=turn+' wins!';over=true}else if(board.every(Boolean)){$('ticStatus').textContent='Draw!';over=true}else{turn=turn==='X'?'O':'X';$('ticStatus').textContent=turn+"'s turn"}drawTic()};$('board').append(b)})}resetTic();let colors=[['Red','#e64c57'],['Blue','#397bff'],['Green','#36b67c'],['Yellow','#f1ca3d']];function nextColor(){let chosen=colors[Math.floor(Math.random()*colors.length)];$('target').textContent=chosen[0];$('colorStatus').textContent='';$('colorButtons').innerHTML='';[...colors].sort(()=>Math.random()-.5).forEach(([name,hex])=>{let b=document.createElement('button');b.style.background=hex;b.setAttribute('aria-label',name);b.onclick=()=>{$('colorStatus').textContent=name===chosen[0]?'Correct!':'Try again!'};$('colorButtons').append(b)})}nextColor();let values,shown,matched,lock;function resetMemory(){values=['🍎','🚀','⭐','🐱','🍎','🚀','⭐','🐱'].sort(()=>Math.random()-.5);shown=[];matched=[];lock=false;$('memoryStatus').textContent='Find the pairs!';drawMemory()}function drawMemory(){$('memoryGrid').innerHTML='';values.forEach((v,i)=>{let b=document.createElement('button');b.textContent=shown.includes(i)||matched.includes(i)?v:'?';b.onclick=()=>{if(lock||shown.includes(i)||matched.includes(i))return;shown.push(i);drawMemory();if(shown.length===2){lock=true;let[a,c]=shown;if(values[a]===values[c]){matched.push(a,c);shown=[];lock=false;if(matched.length===8)$('memoryStatus').textContent='You matched them all!';drawMemory()}else setTimeout(()=>{shown=[];lock=false;drawMemory()},650)}};$('memoryGrid').append(b)})}resetMemory();</script></html>
